<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☀️ Soleil Fytli - Démo Interactive</title>
<style>
  body {
    background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #FFD75F;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 10px;
    font-size: 2.5em;
    text-shadow: 0 0 20px rgba(255, 215, 95, 0.5);
  }

  .subtitle {
    text-align: center;
    margin-bottom: 40px;
    font-size: 1.2em;
    color: #FFB347;
    font-style: italic;
  }

  .sun-wrapper {
    width: 250px;
    height: 250px;
    filter: drop-shadow(0 0 30px rgba(255, 160, 0, 0.6));
    position: relative;
    margin-bottom: 40px;
  }

  svg {
    width: 100%;
    height: 100%;
  }

  .core {
    animation: pulse 3s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.1); filter: brightness(1.3); }
  }

  .halo {
    animation: glow 6s ease-in-out infinite;
    transform-origin: center;
  }

  @keyframes glow {
    0%, 100% { opacity: 0.3; stroke-width: 6; }
    50% { opacity: 0.6; stroke-width: 10; }
  }

  .orb {
    transform-origin: 125px 125px;
    opacity: 0.8;
  }

  .orb1 { animation: orbit1 6s linear infinite; }
  .orb2 { animation: orbit2 9s linear infinite; }
  .orb3 { animation: orbit3 7s linear infinite; }
  .orb4 { animation: orbit4 5s linear infinite; }
  .orb5 { animation: orbit5 8s linear infinite; }

  @keyframes orbit1 {
    from { transform: rotate(0deg) translateX(80px) rotate(0deg); }
    to { transform: rotate(360deg) translateX(80px) rotate(-360deg); }
  }
  @keyframes orbit2 {
    from { transform: rotate(0deg) translateX(100px) rotate(0deg); }
    to { transform: rotate(360deg) translateX(100px) rotate(-360deg); }
  }
  @keyframes orbit3 {
    from { transform: rotate(0deg) translateX(90px) rotate(0deg); }
    to { transform: rotate(360deg) translateX(90px) rotate(-360deg); }
  }
  @keyframes orbit4 {
    from { transform: rotate(0deg) translateX(70px) rotate(0deg); }
    to { transform: rotate(360deg) translateX(70px) rotate(-360deg); }
  }
  @keyframes orbit5 {
    from { transform: rotate(0deg) translateX(110px) rotate(0deg); }
    to { transform: rotate(360deg) translateX(110px) rotate(-360deg); }
  }

  /* Animation de pulsation lors de l'ajout d'utilisateurs */
  @keyframes userJoinPulse {
    0% { 
      stroke-width: 8;
      opacity: 0.4;
    }
    50% { 
      stroke-width: 16;
      opacity: 0.9;
    }
    100% { 
      stroke-width: 8;
      opacity: 0.4;
    }
  }

  .halo.user-joined {
    animation: userJoinPulse 0.8s ease-out;
  }

  /* Contrôles interactifs */
  .controls {
    background: rgba(255, 215, 95, 0.1);
    border: 2px solid #FFB347;
    border-radius: 15px;
    padding: 30px;
    max-width: 400px;
    width: 100%;
    backdrop-filter: blur(10px);
  }

  .control-group {
    margin-bottom: 25px;
  }

  .control-group label {
    display: block;
    margin-bottom: 10px;
    font-size: 1.1em;
    color: #FFD75F;
  }

  .control-group input[type="range"] {
    width: 100%;
    height: 8px;
    border-radius: 5px;
    background: rgba(255, 179, 71, 0.3);
    outline: none;
    -webkit-appearance: none;
  }

  .control-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFD75F 0%, #FF7A00 100%);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255, 122, 0, 0.5);
  }

  .control-group input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFD75F 0%, #FF7A00 100%);
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255, 122, 0, 0.5);
    border: none;
  }

  .value-display {
    text-align: center;
    font-size: 1.3em;
    color: #FF7A00;
    margin-top: 5px;
    font-weight: bold;
  }

  button {
    background: linear-gradient(135deg, #FFD75F 0%, #FF7A00 100%);
    border: none;
    color: #000;
    padding: 12px 24px;
    font-size: 1.1em;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s, box-shadow 0.2s;
    width: 100%;
    margin-top: 10px;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(255, 122, 0, 0.5);
  }

  button:active {
    transform: translateY(0);
  }

  .info {
    text-align: center;
    margin-top: 30px;
    color: #FFB347;
    font-size: 0.9em;
    max-width: 600px;
  }
</style>
</head>
<body>

<h1>☀️ Soleil Fytli</h1>
<p class="subtitle">"Plus on bouge ensemble, plus la lumière s'intensifie."</p>

<div class="sun-wrapper">
  <svg viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="fytliGradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFD75F"/>
        <stop offset="60%" stop-color="#FF7A00"/>
        <stop offset="100%" stop-color="#B84300"/>
      </radialGradient>
      <filter id="softGlow">
        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <circle class="halo" id="halo" cx="125" cy="125" r="90" fill="none" stroke="#FFB347" stroke-width="8" opacity="0.4" filter="url(#softGlow)"/>
    <circle class="core" cx="125" cy="125" r="60" fill="url(#fytliGradient)" />
    
    <!-- Orbes initiaux -->
    <circle class="orb orb1" r="4" cx="125" cy="35" fill="#FFD75F" />
    <circle class="orb orb2" r="6" cx="215" cy="125" fill="#FFC64D" />
    <circle class="orb orb3" r="3" cx="125" cy="215" fill="#FF9A2B" />
    <circle class="orb orb4" r="5" cx="35" cy="125" fill="#FFB347" />
  </svg>
</div>

<div class="controls">
  <div class="control-group">
    <label for="activity">
      Niveau d'activité collective
      <div class="value-display" id="activityValue">50%</div>
    </label>
    <input type="range" id="activity" min="0" max="100" value="50">
  </div>

  <div class="control-group">
    <label for="users">
      Utilisateurs connectés
      <div class="value-display" id="userValue">4 utilisateurs</div>
    </label>
    <input type="range" id="users" min="1" max="8" value="4">
  </div>

  <button onclick="simulateUserJoin()">➕ Simuler un nouvel arrivant</button>
</div>

<div class="info">
  <p>🌟 Ajustez les curseurs pour voir le Soleil Fytli réagir en temps réel.</p>
  <p>Le soleil brille plus intensément quand l'activité collective augmente, et pulse quand quelqu'un rejoint la session.</p>
</div>

<script>
  const activitySlider = document.getElementById('activity');
  const usersSlider = document.getElementById('users');
  const activityValue = document.getElementById('activityValue');
  const userValue = document.getElementById('userValue');
  const sunWrapper = document.querySelector('.sun-wrapper');
  const halo = document.getElementById('halo');

  // Mise à jour de l'activité
  activitySlider.addEventListener('input', (e) => {
    const value = e.target.value;
    activityValue.textContent = `${value}%`;
    
    // Ajuster l'intensité du glow
    const intensity = value / 100;
    sunWrapper.style.filter = `drop-shadow(0 0 ${30 + intensity * 20}px rgba(255, 160, 0, ${0.6 + intensity * 0.3}))`;
  });

  // Mise à jour du nombre d'utilisateurs
  usersSlider.addEventListener('input', (e) => {
    const value = e.target.value;
    userValue.textContent = `${value} utilisateur${value > 1 ? 's' : ''}`;
  });

  // Simuler l'arrivée d'un utilisateur
  function simulateUserJoin() {
    // Augmenter le compteur
    const currentValue = parseInt(usersSlider.value);
    if (currentValue < 8) {
      usersSlider.value = currentValue + 1;
      userValue.textContent = `${currentValue + 1} utilisateur${currentValue + 1 > 1 ? 's' : ''}`;
    }

    // Déclencher l'animation de pulsation du halo
    halo.classList.add('user-joined');
    setTimeout(() => {
      halo.classList.remove('user-joined');
    }, 800);
  }

  // Initialisation
  activityValue.textContent = '50%';
  userValue.textContent = '4 utilisateurs';
</script>

</body>
</html>
